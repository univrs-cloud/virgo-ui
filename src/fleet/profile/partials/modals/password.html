<div id="fleet-user-password" class="modal fade" tabindex="-1">
	<u-form>
		<div class="modal-dialog modal-sm modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Change password</h5>
				</div>
				<div class="modal-body">
					<div class="alert alert-light">
						<dl class="m-0">
							<dt class="fw-light text-body-tertiary"><small>Logged in as</small></dt>
							<dd class="title-email m-0"></dd>
						</dl>
					</div>
					<u-input type="password" name="currentPassword" label="Current password" class="current-password" autocomplete="off"></u-input>
					<u-input type="password" name="password" label="New password" class="password" autocomplete="off"></u-input>
					<u-input type="password" name="passwordCheck" label="Confirm password" class="password-check" autocomplete="off"></u-input>
					<p class="text-body-tertiary mt-2 mb-0"><small>You'll be signed out on all devices after changing your password.</small></p>
				</div>
				<div class="modal-footer">
					<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="modal" outline>Cancel</u-button>
					<u-button type="submit" variant="primary">Update</u-button>
				</div>
			</div>
		</div>
	</u-form>
</div>
