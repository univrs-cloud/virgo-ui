<div class="profile">
	<div class="row gx-4 gy-3 mb-3">
		<div class="col col-12">
			<div class="card rounded-4 border-0 mb-0">
				<div class="card-body">
					<div class="dropdown float-end mt-n1">
						<span data-bs-toggle="dropdown" class="dropdown-toggle caret-off btn btn-sm"><i class="icon-solid icon-ellipsis-vertical icon-fw text-secondary"></i></span>
						<div class="dropdown-menu dropdown-menu-end">
							<a href="#fleet-profile-edit" class="dropdown-item" data-bs-toggle="modal"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit profile</a>
							<a href="#fleet-user-password" class="dropdown-item" data-bs-toggle="modal"><i class="icon-regular icon-key icon-fw me-1"></i>Change password</a>
						</div>
					</div>
					<h5 class="card-title d-flex align-items-center"><%-account.name || account.email%></h5>
					<dl class="m-0">
						<dt class="fw-lighter"><small>Email address</small></dt>
						<dd><%-account.email || '—'%></dd>

						<hr class="border-secondary-subtle my-4">

						<dt class="fw-lighter"><small>Biometric sign-in</small></dt>
						<dd class="m-0">
							<u-switch class="biometrics-switch" on-label="Enabled" <%=(account.passkeyEnabled ? 'checked' : '')%> disabled></u-switch>
							<small class="d-block fw-lighter text-body-tertiary biometrics-hint">Sign in with your fingerprint or face instead of your password and code.</small>
						</dd>

						<hr class="border-secondary-subtle my-4">

						<dt class="fw-lighter"><small>Notifications</small></dt>
						<dd class="m-0">
							<u-switch class="notifications-switch" on-label="Enabled" <%=(account.pushEnabled ? 'checked' : '')%> disabled></u-switch>
							<small class="d-block fw-lighter text-body-tertiary notifications-hint">Get notified when your nodes have updates or storage issues.</small>
						</dd>
					</dl>
				</div>
			</div>
		</div>
	</div>
</div>
