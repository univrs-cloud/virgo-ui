<div class="profile">
	<div class="row gx-7 gy-5 mb-5">
		<div class="col col-12">
			<div class="card border-0 mb-0">
				<div class="card-body">
					<div class="dropdown float-end mt--1">
						<span data-bs-toggle="menu" data-bs-placement="bottom-end" class="btn-icon btn-text theme-secondary btn-sm"><i class="icon-solid icon-ellipsis-vertical icon-fw fg-secondary"></i></span>
						<div class="menu">
							<a href="#fleet-profile-edit" class="menu-item" data-bs-toggle="dialog"><i class="icon-regular icon-pen icon-fw"></i>Edit profile</a>
							<a href="#fleet-user-password" class="menu-item" data-bs-toggle="dialog"><i class="icon-regular icon-key icon-fw"></i>Change password</a>
						</div>
					</div>
					<h5 class="card-title d-flex align-items-center"><%-account.name || account.email%></h5>
					<dl class="m-0">
						<dt class="fw-lighter"><small>Email address</small></dt>
						<dd><%-account.email || '—'%></dd>

						<hr class="border-gray-200 my-5 opacity-25">

						<dt class="fw-lighter"><small>Biometric sign-in</small></dt>
						<dd class="m-0">
							<u-switch class="biometrics-switch" on-label="Enabled" <%=(account.passkeyEnabled ? 'checked' : '')%> disabled></u-switch>
							<small class="d-block fw-lighter fg-4 biometrics-hint">Sign in with your fingerprint or face instead of your password and code.</small>
						</dd>

						<hr class="border-gray-200 my-5 opacity-25">

						<dt class="fw-lighter"><small>Notifications</small></dt>
						<dd class="m-0">
							<u-switch class="notifications-switch" on-label="Enabled" <%=(account.pushEnabled ? 'checked' : '')%> disabled></u-switch>
							<small class="d-block fw-lighter fg-4 notifications-hint">Get notified when your nodes have updates or storage issues.</small>
						</dd>
					</dl>
				</div>
			</div>
		</div>
	</div>
</div>
