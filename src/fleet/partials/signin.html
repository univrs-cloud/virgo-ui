<div class="full-screen d-flex align-items-center justify-content-center h-100 p-5">
	<svg class="login-background position-fixed top-0 start-0 w-100 h-100" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
		<defs>
			<linearGradient id="login-base" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0%"/>
				<stop offset="55%"/>
				<stop offset="100%"/>
			</linearGradient>
		</defs>
		<rect width="1440" height="900" fill="url(#login-base)"/>
	</svg>
	<u-particles class="login-particles position-fixed top-0 start-0 w-100 h-100"></u-particles>
	<div class="card login-card position-relative shadow w-100" style="max-width: 24rem;">
		<div class="card-body p-7">
			<div class="text-center mb-7">
				<img class="login-logo" src="assets/img/univrs.svg" width="60" height="60" alt="">
			</div>
			<div class="biometric d-none">
				<div class="text-center">
					<u-button class="biometric-action" variant="primary"><i class="icon-fingerprint icon-fw"></i>Sign in with biometrics</u-button>
				</div>
				<div class="d-flex align-items-center my-5">
					<hr class="flex-grow-1 border-gray-200 my-0 opacity-25">
					<small class="px-3 fg-emphasis-secondary">or</small>
					<hr class="flex-grow-1 border-gray-200 my-0 opacity-25">
				</div>
			</div>
			<div class="passkey d-none">
				<div class="text-center">
					<u-button class="passkey-action" variant="primary"><i class="icon-scan-face icon-fw"></i>Sign in with a passkey</u-button>
				</div>
				<div class="d-flex align-items-center my-5">
					<hr class="flex-grow-1 border-gray-200 my-0 opacity-25">
					<small class="px-3 fg-emphasis-secondary">or</small>
					<hr class="flex-grow-1 border-gray-200 my-0 opacity-25">
				</div>
			</div>
			<u-form class="signin">
				<h4 class="text-center mb-5">Authentication</h4>
				<u-input type="email" name="email" label="Email" class="email"></u-input>
				<u-input type="password" name="password" label="Password" class="password" autocomplete="current-password"></u-input>
				<div class="d-flex align-items-center justify-content-between mt-5">
					<a href="/signup" class="text-decoration-none">Register</a>
					<u-button type="submit" variant="primary">Sign in</u-button>
				</div>
			</u-form>
		</div>
	</div>
</div>
