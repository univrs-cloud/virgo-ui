<div class="d-flex align-items-center justify-content-center h-100 p-3">
	<div class="card shadow-sm border-0" style="width: 100%; max-width: 24rem;">
		<div class="card-body p-4">
			<div class="text-center mb-4">
				<img src="assets/img/fleet.svg" width="48" alt="">
			</div>
			<div class="biometrics d-none">
				<div class="text-center">
					<u-button class="biometrics-action" variant="primary"><i class="icon-solid icon-fingerprint icon-fw me-1"></i>Sign in with biometrics</u-button>
				</div>
				<small class="d-block text-center fw-lighter text-body-tertiary mt-2 biometrics-hint"></small>
				<div class="d-flex align-items-center my-3">
					<hr class="flex-grow-1 border-secondary-subtle my-0">
					<small class="px-2 fw-lighter text-body-tertiary">or</small>
					<hr class="flex-grow-1 border-secondary-subtle my-0">
				</div>
			</div>
			<u-form class="signin">
				<h5 class="text-center mb-3">Authentication</h5>
				<u-input type="email" name="email" label="Email" class="email"></u-input>
				<u-input type="password" name="password" label="Password" class="password" autocomplete="current-password"></u-input>
				<div class="d-flex align-items-center justify-content-between mt-3">
					<a href="/signup" class="text-decoration-none">Register</a>
					<u-button type="submit" variant="primary">Sign in</u-button>
				</div>
			</u-form>
		</div>
	</div>
</div>
