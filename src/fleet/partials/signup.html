<div class="d-flex align-items-center justify-content-center h-100 p-5">
	<div class="card shadow border-0" style="width: 100%; max-width: 24rem;">
		<div class="card-body p-7">
			<div class="text-center mb-7">
				<img src="assets/img/fleet.svg" width="60" alt="">
			</div>
			<u-form class="register">
				<h4 class="text-center mb-5">Registration</h4>
				<u-input name="name" label="Name" class="name" autocomplete="name"></u-input>
				<u-input type="email" name="email" label="Email" class="email"></u-input>
				<u-input type="password" name="password" label="Password" class="password" autocomplete="new-password"></u-input>
				<u-input type="password" name="passwordConfirm" label="Confirm password" class="password-confirm" autocomplete="new-password"></u-input>
				<div class="d-flex align-items-center justify-content-between mt-5">
					<a href="/signin" class="text-decoration-none">Sign in</a>
					<u-button type="submit" variant="primary">Register</u-button>
				</div>
			</u-form>
			<div class="check-email d-none text-center">
				<h4 class="mb-5">Check your email</h4>
				<p class="fg-secondary mb-7">
					We sent a verification link to <strong class="check-email-address"></strong>.
					Click it to finish creating your account. The link expires in 30 minutes.
				</p>
				<a href="/signin" class="text-decoration-none">Back to sign in</a>
			</div>
		</div>
	</div>
</div>
