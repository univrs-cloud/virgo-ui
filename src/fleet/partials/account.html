<div class="dropdown dropup d-flex align-items-center">
	<button type="button" class="account-toggle dropdown-toggle caret-off d-flex align-items-center gap-2 w-100 border-0 bg-transparent rounded p-2 text-white" data-bs-toggle="dropdown">
		<img src="assets/img/user-circle.svg" alt="profile" class="rounded-circle flex-shrink-0" style="width: 32px; height: 32px;">
		<span class="d-none d-sm-block text-start min-w-0 flex-grow-1" style="line-height: 1.2;">
			<span class="d-block text-truncate fw-medium" style="font-size: 0.875rem;" title="<%-account.name || account.email || '—'%>"><%-account.name || account.email || '—'%></span>
			<%if (account.name && account.email) {%>
				<span class="d-block text-truncate fw-light opacity-75" style="font-size: 0.8125rem;"><%-account.email%></span>
			<%}%>
		</span>
		<i class="icon-light icon-angles-up-down icon-fw d-none d-sm-inline-block flex-shrink-0 opacity-75" style="font-size: 0.8125rem;"></i>
	</button>
	<div class="dropdown-menu dropdown-menu-end" style="max-width: min(18rem, calc(100vw - 1.5rem));">
		<h6 class="dropdown-header">Logged in as</h6>
		<p class="text-truncate fw-medium px-2 pb-2 mt-n1 mb-0" title="<%-account.name || '—'%>"><%-account.name || '—'%></p>
		<div class="dropdown-divider"></div>
		<a href="/users/profile" class="dropdown-item">Your profile</a>
		<div class="dropdown-divider"></div>
		<a href="#" class="sign-out dropdown-item">
			Sign out
			<i class="icon-duotone icon-solid icon-person-from-portal icon-fw ms-2"></i>
		</a>
	</div>
</div>
