<div class="full-screen d-flex align-items-center justify-content-center h-100 p-5">
	<svg class="login-background position-fixed top-0 start-0 w-100 h-100" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
		<defs>
			<linearGradient id="login-base" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0%"/>
				<stop offset="55%"/>
				<stop offset="100%"/>
			</linearGradient>
		</defs>
		<rect width="1440" height="900" fill="url(#login-base)"/>
	</svg>
	<u-particles class="login-particles position-fixed top-0 start-0 w-100 h-100"></u-particles>
	<div class="card login-card position-relative shadow w-100" style="max-width: 24rem;">
		<div class="card-body p-7">
			<div class="text-center mb-7">
				<img src="assets/img/fleet.svg" width="60" alt="">
			</div>
			<u-form class="challenge">
				<h4 class="text-center mb-5">Two-factor authentication</h4>
				<u-otp name="code" label="6-digit code" class="code" align="center" autocomplete="one-time-code"></u-otp>
				<div class="d-flex align-items-center justify-content-between mt-5">
					<a href="#" class="show-recovery text-decoration-none">Use a recovery code</a>
					<u-button type="submit" variant="primary">Verify</u-button>
				</div>
			</u-form>
			<u-form class="recovery d-none">
				<h4 class="text-center mb-5">Enter a recovery code</h4>
				<u-input name="recoveryCode" label="Recovery code" class="recovery-code"></u-input>
				<div class="d-flex align-items-center justify-content-between mt-5">
					<a href="#" class="show-challenge text-decoration-none">Use your app instead</a>
					<u-button type="submit" variant="primary">Verify</u-button>
				</div>
			</u-form>
			<div class="text-center mt-5">
				<a href="#" class="sign-out text-decoration-none small fg-emphasis-secondary">Sign out</a>
			</div>
		</div>
	</div>
</div>
