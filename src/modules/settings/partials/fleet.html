<div class="col col-12">
	<div class="card rounded-4 border-0 mb-0">
		<div class="card-body">
			<a href="#fleet" class="btn btn-link p-0 float-end" data-bs-toggle="modal"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit</a>
			<h5 class="card-title d-flex align-items-center">Fleet</h5>
			<dl class="m-0">
				<dt class="fw-lighter"><small>Status</small></dt>
				<dd><%=(fleet?.enabled ? 'Enabled' : 'Disabled')%></dd>
				<%if (fleet?.registered) {%>
					<dt class="fw-lighter"><small>Account</small></dt>
					<dd class="m-0"><%=fleet?.email || 'Registered'%></dd>
				<%} else if (fleet?.enabled) {%>
					<dd class="m-0 text-warning">Awaiting registration</dd>
				<%} else {%>
					<dd class="m-0 text-body-tertiary">Not connected to fleet</dd>
				<%}%>
			</dl>
		</div>
	</div>
</div>
