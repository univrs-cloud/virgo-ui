<div id="storage" class="row d-none">
	<div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
		<div class="mb-4">
			<h4 class="mb-2">Storage</h4>
			<p class="text-body-secondary m-0">Virgo OS keeps your apps and data on a mirrored storage pool of two drives.</p>
		</div>
		<div class="card rounded-4 border-0 mb-0">
			<div class="card-body">
				<h5 class="card-title">Pool</h5>
				<div class="fetching d-flex justify-content-center align-items-center py-4"><div class="spinner-border text-gray-600"></div></div>
				<div class="summary d-none"></div>
				<div class="actions d-none d-flex align-items-center justify-content-between mt-4">
					<a href="#" class="rescan text-decoration-none">Scan again</a>
					<div class="d-flex gap-2 ms-auto">
						<u-button variant="secondary" data-action="back" outline>Back</u-button>
						<u-button variant="primary" data-action="import" class="d-none" loading-text="Importing pool...">Import pool</u-button>
						<u-button variant="danger" data-action="create" class="d-none" loading-text="Creating pool...">Create pool</u-button>
						<u-button variant="primary" data-action="continue" class="d-none">Continue</u-button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
