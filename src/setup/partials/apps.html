<div id="apps" class="row d-none">
	<div class="col-12 d-flex flex-column">
		<div class="mb-7">
			<h4 class="mb-3">Core apps</h4>
			<p class="fg-emphasis-secondary m-0">Three apps are installed onto the pool before this node can be signed in to. <a href="https://docs.univrs.cloud/setup/apps/" class="text-nowrap" target="_blank" rel="noopener noreferrer" data-bs-toggle="tooltip" data-bs-original-title="Open the docs for this step">Learn more<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-1"></i></a></p>
		</div>
		<div class="card border-0 flex-grow-1 min-h-0 mb-0">
			<div class="card-body min-h-0 overflow-y-auto pb-0">
				<dl class="core m-0"></dl>
				<div class="certificate-checking d-none align-items-center fg-emphasis-secondary mt-5">
					<i class="icon-solid icon-spinner-third icon-fw icon-spin me-3"></i>
					<small>Waiting for the certificate for <span class="certificate-fqdn fg-body"></span>...</small>
				</div>
				<div class="certificate-warning alert theme-warning d-none mt-5 mb-0">
					<div>
						<div class="fw-semibold">The certificate is not ready yet</div>
						<small class="certificate-reason"></small>
					</div>
				</div>
			</div>
			<div class="d-flex justify-content-end gap-3 px-5 pb-5 mt-7">
				<u-button variant="secondary" data-action="back" outline>Back</u-button>
				<u-button variant="primary" data-action="continue" disabled>Continue</u-button>
			</div>
		</div>
	</div>
</div>
