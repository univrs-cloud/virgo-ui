<dt class="fw-lighter"><small><i class="icon-light icon-list-tree icon-fw me-1"></i>Topology <span class="text-body-tertiary">(<%=_.pluralize('group', _.size(groups), true)%>)</span></small></dt>
<dd class="vdev-tree m-0">
	<span class="d-flex flex-wrap justify-content-center gap-3">
		<%_.each(groups, (group) => {%>
			<span class="text-center">
				<span class="d-block">
					<u-badge color="<%-(group.color || 'gray')%>" pill><small><%-group.name%></small></u-badge>
				</span>
				<span class="d-inline-block">
					<span class="vdev-bar d-block"></span>
					<span class="vdev-slots">
						<%_.each(group.disks, (disk) => {%>
							<span class="vdev-slot <%=(disk.role === 'old' ? 'opacity-50' : '')%>">
								<span class="vdev-stem d-block"></span>
								<span class="position-relative d-flex justify-content-center w-100">
									<%if (disk.role === 'new') {%>
										<i class="icon-solid icon-arrow-right icon-xs icon-width-auto lh-1 text-body-tertiary position-absolute top-50 start-0 translate-middle"></i>
									<%}%>
									<span class="position-relative d-inline-flex">
										<i class="vdev-disk icon-duotone icon-solid icon-hard-drive <%-(disk.color || 'text-blue-500')%> <%=(disk.isFading ? 'icon-fade' : '')%>"<%=(disk.tip ? ` data-bs-toggle="tooltip" data-bs-original-title="${disk.tip}"` : '')%>></i>
										<%if (disk.usedIn) {%>
											<i class="icon-solid icon-link icon-2xs icon-width-auto lh-1 text-blue-500 position-absolute top-0 start-100 translate-middle"></i>
										<%}%>
									</span>
								</span>
								<small class="text-body-tertiary text-truncate w-100 mt-1"><%-disk.label%></small>
							</span>
						<%})%>
					</span>
				</span>
			</span>
		<%})%>
	</span>
</dd>
