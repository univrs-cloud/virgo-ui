<div id="host" class="row d-none">
	<div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
		<div class="mb-4">
			<h4 class="mb-2">Network</h4>
			<p class="text-body-secondary m-0">Choose how this node identifies itself on your network.</p>
		</div>
		<u-form>
			<div class="card rounded-4 border-0 mb-0">
				<div class="card-body">
					<h5 class="card-title">Host</h5>
					<u-input name="hostname" label="Hostname" class="hostname" autocomplete="off"></u-input>
					<u-input name="domainName" label="Domain name" class="domain-name" autocomplete="off"></u-input>
					<div class="access d-none align-items-center text-body-secondary mb-3">
						<i class="icon-duotone icon-solid icon-globe icon-fw me-2"></i>
						<small>Once setup completes this node will be reachable at <span class="url text-body"></span></small>
					</div>
					<div class="d-flex justify-content-end gap-2">
						<u-button variant="secondary" data-action="back" outline>Back</u-button>
						<u-button type="submit" variant="primary" loading-text="Updating host...">Continue</u-button>
					</div>
				</div>
			</div>
		</u-form>
	</div>
</div>
