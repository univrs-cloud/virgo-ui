<div id="fleet" class="row d-none">
	<div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
		<div class="mb-4">
			<h4 class="mb-2">Fleet</h4>
			<p class="text-body-secondary m-0">Register this node with your fleet account to manage it from anywhere.</p>
		</div>
		<div class="card rounded-4 border-0 mb-0">
			<div class="card-body">
				<a href="https://fleet.univrs.cloud" target="_blank" rel="noopener noreferrer" class="fleet-link btn btn-link p-0 float-end d-inline-flex align-items-center">
					<span>Create account</span>
					<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-2"></i>
				</a>
				<h5 class="card-title">Registration</h5>
				<u-form class="registration">
					<p class="state text-body-secondary">This node is not registered with a fleet yet.</p>
					<u-input name="email" label="Fleet account email" class="email" autocomplete="off"></u-input>
					<u-input type="password" name="password" label="Fleet account password" class="password" autocomplete="off"></u-input>
					<div class="d-flex align-items-center justify-content-between">
						<div class="d-flex gap-2 ms-auto">
							<u-button variant="secondary" data-action="back" outline>Back</u-button>
							<u-button type="submit" variant="primary" loading-text="Registering...">Register</u-button>
						</div>
					</div>
				</u-form>
				<div class="registered d-none">
					<dl class="status m-0"></dl>
					<div class="d-flex align-items-center justify-content-between mt-4">
						<a href="#" class="re-register text-decoration-none d-none">Register again</a>
						<div class="d-flex gap-2 ms-auto">
							<u-button variant="secondary" data-action="back" outline>Back</u-button>
							<u-button variant="primary" data-action="continue">Continue</u-button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
