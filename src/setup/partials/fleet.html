<div id="fleet" class="row d-none">
	<div class="col-12 md:col-10 lg:col-8 xl:col-6 mx-auto">
		<div class="mb-7">
			<h4 class="mb-3">Fleet</h4>
			<p class="fg-emphasis-secondary m-0">Register this node with your fleet account to manage it from anywhere. <a href="https://docs.univrs.cloud/setup/fleet/" class="text-nowrap" target="_blank" rel="noopener noreferrer" data-bs-toggle="tooltip" data-bs-original-title="Open the docs for this step">Learn more<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-1"></i></a></p>
		</div>
		<div class="card border-0 mb-0">
			<div class="card-body">
				<a href="https://fleet.univrs.cloud" target="_blank" rel="noopener noreferrer" class="fleet-link btn-link d-inline-block p-0 float-end min-h-0">
					<span>Create account</span>
					<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-3"></i>
				</a>
				<h5 class="card-title">Registration</h5>
				<u-form class="registration">
					<p class="state fg-emphasis-secondary">This node is not registered with a fleet yet. <span class="optional d-none">Registration is optional on your own domain; you can do it later from Settings.</span></p>
					<u-input name="email" label="Fleet account email" class="email" autocomplete="off"></u-input>
					<u-input type="password" name="password" label="Fleet account password" class="password" autocomplete="off"></u-input>
					<div class="d-flex align-items-center justify-content-between">
						<div class="d-flex gap-3 ms-auto">
							<u-button variant="secondary" data-action="back" outline>Back</u-button>
							<u-button variant="secondary" data-action="skip" class="skip d-none" outline>Skip</u-button>
							<u-button type="submit" variant="primary" loading-text="Registering...">Register</u-button>
						</div>
					</div>
				</u-form>
				<div class="registered d-none">
					<dl class="status m-0"></dl>
					<div class="d-flex align-items-center justify-content-between mt-7">
						<a href="#" class="re-register text-decoration-none d-none">Register again</a>
						<div class="d-flex gap-3 ms-auto">
							<u-button variant="secondary" data-action="back" outline>Back</u-button>
							<u-button variant="primary" data-action="continue">Continue</u-button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
