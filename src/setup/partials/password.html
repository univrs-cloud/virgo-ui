<div id="password" class="row d-none">
	<div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
		<div class="mb-4">
			<h4 class="mb-2">Password</h4>
			<p class="text-body-secondary m-0">For security reasons, the factory password should be changed.</p>
		</div>
		<u-form>
			<div class="card rounded-4 border-0 mb-0">
				<div class="card-body">
					<h5 class="card-title">Account</h5>
					<div class="alert alert-light">
						<dl class="m-0">
							<dt class="fw-light text-body-tertiary"><small>Username</small></dt>
							<dd class="username m-0"></dd>
						</dl>
					</div>
					<u-input type="password" name="password" label="New password" class="password" autocomplete="new-password"></u-input>
					<u-input type="password" name="passwordCheck" label="Confirm password" class="password-check" autocomplete="new-password"></u-input>
					<div class="d-flex justify-content-end gap-2">
						<u-button variant="secondary" data-action="back" outline>Back</u-button>
						<u-button type="submit" variant="primary" loading-text="Changing password...">Continue</u-button>
					</div>
				</div>
			</div>
		</u-form>
	</div>
</div>
