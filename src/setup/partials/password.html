<div id="password" class="row d-none">
	<div class="col-12 d-flex flex-column">
		<div class="mb-7">
			<h4 class="mb-3">Password</h4>
			<p class="fg-emphasis-secondary m-0">For security reasons, the factory password should be changed. <a href="https://docs.univrs.cloud/setup/password/" class="text-nowrap" target="_blank" rel="noopener noreferrer" data-bs-toggle="tooltip" data-bs-original-title="Open the docs for this step">Learn more<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-1"></i></a></p>
		</div>
		<u-form>
			<div class="card border-0 flex-grow-1 min-h-0 mb-0">
				<div class="card-body min-h-0 overflow-y-auto pb-0">
					<div class="alert theme-secondary mb-5">
						<dl class="m-0">
							<dt class="fw-light fg-4"><small>Username</small></dt>
							<dd class="username m-0"></dd>
						</dl>
					</div>
					<u-input type="password" name="password" label="New password" class="password" autocomplete="new-password"></u-input>
					<u-input type="password" name="passwordCheck" label="Confirm password" class="password-check" autocomplete="new-password"></u-input>
				</div>
				<div class="d-flex justify-content-end gap-3 px-5 pb-5">
					<u-button variant="secondary" data-action="back" outline>Back</u-button>
					<u-button type="submit" variant="primary" loading-text="Changing password...">Continue</u-button>
				</div>
			</div>
		</u-form>
	</div>
</div>
