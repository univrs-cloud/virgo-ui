<div id="welcome" class="row">
	<div class="col-12 d-flex flex-column justify-content-center align-items-center">
		<div class="no-content-image"><%=welcomeImage%></div>
		<h5 class="fg-4 mt-7">Welcome to virgoOS</h5>
		<p class="fg-4 text-center mb-0">Let's set up your node.</p>
		<div class="d-flex position-relative mt-7">
			<u-button variant="primary" data-action="start" class="invisible">Start</u-button>
			<div class="waiting position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center text-nowrap">
				<div class="spinner-border spinner-sm me-3"></div>
				Connecting to your node...
			</div>
		</div>
	</div>
</div>
