<div class="item dropdown d-inline-flex align-items-center rounded-pill bd-gray-200 ps-2 pe-1" data-id="<%-trustedProxy%>">
	<%if (!_.isEmpty(jobs)) {%>
		<span class="badge fw-normal text-reset px-0 me-1"><%-trustedProxy%><i class="icon-solid icon-gear icon-spin text-secondary ms-2"></i></span>
	<%} else {%>
		<span class="badge fw-normal text-reset p-0"><%-trustedProxy%></span>
		<span data-bs-toggle="dropdown" class="dropdown-toggle caret-off btn rounded-circle ms-1" style="--bs-btn-font-size: 0.75rem; --bs-btn-line-height: 1; --bs-btn-padding-x: 0.125rem; --bs-btn-padding-y: 0.25rem; --bs-btn-border-width: 0; --bs-btn-hover-bg: var(--bs-gray-300); --bs-btn-active-bg: var(--bs-gray-300);"><i class="icon-solid icon-ellipsis-vertical icon-fw text-secondary"></i></span>
		<div class="dropdown-menu">
			<a href="#trusted-proxy-edit" class="dropdown-item" data-bs-toggle="modal"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit</a>
			<div class="dropdown-divider"></div>
			<a href="#" class="dropdown-item text-danger confirm" data-action="delete"><i class="icon-regular icon-times icon-fw me-1"></i>Delete</a>
		</div>
	<%}%>
</div>
