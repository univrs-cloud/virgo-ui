<div id="folders" class="d-none">
	<div class="row">
		<div class="col-12 position-relative mb-5">
			<h4 class="m-0">
				<i class="icon-duotone icon-solid icon-folder-closed icon-width-auto me-3"></i>
				Folders
			</h4>
			<div class="position-absolute top-0 end-0 pe-5 mt--1">
				<a href="#folder-create" class="btn-sm btn-outline theme-secondary py-1 min-h-0" data-bs-toggle="dialog">New folder</a>
			</div>
		</div>
		<div class="loading d-flex justify-content-center align-items-center h-100"><div class="spinner-border fg-gray-600"></div></div>
		<div class="oops d-flex justify-content-center align-items-center h-100 d-none"><span class="fg-red-300">Error fetching data</span></div>
		<div class="container-fluid position-relative d-none">
			<div class="card">
				<div class="card-body">
					<div class="row g-3 align-items-center">
						<div class="col col-6 md:col-4">
							<u-input type="search" name="search" label="Search" class="search"></u-input>
						</div>
						<div class="col-auto ms-auto mb-7">
							<span class="list-count small fg-emphasis-secondary text-nowrap"></span>
						</div>
					</div>
					<div class="table-scroll overflow-y-scroll mt--5 pe-5 mx-0 me--5">
						<table class="table table-hover align-middle numeric-tabular m-0">
							<thead class="sticky-top">
								<tr>
									<th class="orderable asc text-nowrap" data-field="name">
										Name
										<i class="icon icon-duotone icon-solid icon-sort icon-fw ms-1"></i>
									</th>
									<th class="text-nowrap d-none md:d-table-cell" style="width: 85px; min-width: 85px;">Clients</th>
									<th class="text-center text-nowrap" style="width: 105px; min-width: 105px;">Acces on</th>
									<th class="text-nowrap d-none md:d-table-cell" style="width: 300px; min-width: 300px;">Authorized users</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="network.rx" data-default-order="desc" style="width: 120px; min-width: 120px;">
										<i class="icon-solid icon-network-wired icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Network"></i>
										<i class="icon icon-duotone icon-solid icon-sort icon-fw ms-1"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="size" data-default-order="desc" style="width: 100px; min-width: 100px;">
										Capacity
										<i class="icon icon-duotone icon-solid icon-sort icon-fw ms-1"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="alloc" data-default-order="desc" style="width: 100px; min-width: 100px;">
										Usage
										<i class="icon icon-duotone icon-solid icon-sort icon-fw ms-1"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="storage.snapshots" data-default-order="desc" style="width: 100px; min-width: 100px;">
										<i class="icon-solid icon-clock-rotate-left icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Snapshots"></i>
										<i class="icon icon-duotone icon-solid icon-sort icon-fw ms-1"></i>
									</th>
									<th style="width: 30px; min-width: 30px;"></th>
									<th style="width: 30px; min-width: 30px;"></th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
			<div class="details"></div>
		</div>
	</div>
</div>
