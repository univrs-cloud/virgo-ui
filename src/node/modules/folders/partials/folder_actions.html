<%if (!_.isEmpty(jobs)) {%>
	<span class="btn-icon btn-text theme-secondary btn-sm pe-none"><i class="icon-fill icon-gear icon-fw icon-spin"></i></span>
<%} else {%>
	<%if (inline) {%>
		<div class="d-inline-flex align-items-center bg-2 rounded-3">
			<div class="d-inline-flex align-items-center px-1">
				<u-button variant="secondary" size="sm" class="actions-button" text icon data-bs-toggle="dialog" data-bs-target="#folder-update"><i class="icon-fill icon-pen icon-fw fg-body"></i></u-button>
			</div>
	<%}%>
	<div class="<%=(inline ? 'dropdown position-relative' : 'dropdown')%>">
		<%if (inline) {%>
			<span data-bs-toggle="menu" data-bs-placement="bottom-end" class="actions-toggle btn-icon btn-text theme-secondary btn-sm rounded-3"><i class="icon-fill icon-dots-three-outline-vertical icon-fw fg-secondary"></i></span>
		<%} else {%>
			<span data-bs-toggle="menu" data-bs-placement="bottom-end" class="btn-icon btn-text theme-secondary btn-sm"><i class="icon-fill icon-dots-three-outline-vertical icon-fw fg-secondary"></i></span>
		<%}%>
		<div class="menu">
			<%if (!inline) {%>
				<a href="#folder-update" class="menu-item" data-bs-toggle="dialog"><i class="icon-fill icon-pen icon-fw"></i>Edit</a>
				<div class="menu-divider"></div>
			<%}%>
			<a href="#" class="menu-item fg-danger confirm" data-action="delete"><i class="icon-fill icon-x-circle icon-fw"></i><%=(folder.isCustom ? 'Remove' : 'Delete')%></a>
		</div>
	</div>
	<%if (inline) {%>
		</div>
	<%}%>
<%}%>
