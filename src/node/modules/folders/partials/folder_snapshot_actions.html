<%if (_.some(jobs, { name: 'share:rollback' })) {%>
	<span class="btn-icon btn-text theme-secondary btn-sm pe-none"><i class="icon-loader-circle icon-fw icon-spin"></i></span>
<%} else {%>
	<u-button variant="danger" size="sm" class="snapshot-action" text icon tip="Roll back" data-rollback-snapshot="<%-point.snapshot%>" data-rollback-date="<%-point.createdMoment.format('D MMM YYYY, HH:mm')%>"><i class="icon-history icon-fw"></i></u-button>
<%}%>
