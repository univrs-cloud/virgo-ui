<div class="col xl:col-4 lg:col-4 md:col-12 sm:col-12 col-6">
	<div class="card border-0" data-id="<%-shortcut.id%>" data-type="shortcut">
		<div class="card-body ps-0 pe-3 py-1">
			<div class="row g-0 align-items-center">
				<div class="card-image card-spacer col-auto p-3">
					<img src="<%-(_.includes(shortcut.icon, '/') ? shortcut.icon : `assets/img/shortcuts/${shortcut.icon}`)%>">
				</div>
				<div class="col flex-grow-1 text-truncate">
					<%-shortcut.title%>
				</div>
				<%if (isAuthenticated && runtimeRole?.toLowerCase() !== 'fleet' && shortcut.traefik && !_.isEmpty(shortcut.url)) {%>
					<div class="col-auto d-none lg:d-block">
						<a href="#" class="open-window btn-icon btn-text theme-secondary btn-xs fs-sm position-relative z-2" data-url="<%-shortcut.url%>" data-label="<%-shortcut.title%>" data-icon="<%-shortcut.icon%>">
							<i class="icon-regular icon-window icon-fw fg-secondary"></i>
						</a>
					</div>
				<%}%>
			</div>
		</div>
		<%if (!_.isEmpty(shortcut.url)) {%>
			<a href="<%-shortcut.url%>" target="<%-(shortcut?.target || shortcut.name)%>" referrerpolicy="no-referrer" class="stretched-link"></a>
		<%}%>
	</div>
</div>
