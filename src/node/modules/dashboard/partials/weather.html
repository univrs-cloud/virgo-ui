<div id="weather">
	<div class="card border-0 cursor-pointer mb-0" tabindex="0">
		<div class="d-flex align-items-center gap-3 ps-1 pe-4 py-1">
			<div class="weather-icon"><%=weather.icon%></div>
			<span class="temperature fw-medium text-nowrap"><%-weather.temperature%></span>
			<span class="condition fg-3 text-nowrap d-none md:d-inline"><%=_.capitalize(weather.condition)%></span>
		</div>
	</div>
</div>
