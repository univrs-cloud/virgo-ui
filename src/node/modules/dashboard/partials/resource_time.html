<li class="list-group-item time ms-auto order-5 sm:order-0">
	<%if (state.time === null) {%>
		<div class="spinner-border spinner-sm fg-gray-600"></div>
	<%} else if (state.time === false) {%>
		<span class="fg-red-300">Error fetching data</span>
	<%} else {%>
		<small class="fg-gray-500 text-nowrap">
			Uptime: <%=prettyMilliseconds(state.time.uptime * 1000, { secondsDecimalDigits: 0 })%>
		</small>
	<%}%>
</li>
