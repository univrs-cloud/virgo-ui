<li class="list-group-item cpu py-5">
	<h5 class="fg-black mb-0">
		<i class="icon-regular icon-microchip icon-fw me-1 fg-gray-300"></i>CPU
	</h5>
	<%if (state.cpu === null) {%>
		<div class="spinner-border spinner-sm fg-gray-600"></div>
	<%} else if (state.cpu === false) {%>
		<span class="fg-red-300">Error fetching data</span>
	<%} else {%>
		<div class="text-end mt--5 mb-1">
			<small class="fw-light fg-4"><%=state.cpuStats?.currentLoad?.toFixed(0)%>%</small>
			<u-progress>
				<u-progress-bar width="<%=state.cpuStats?.currentLoad%>"></u-progress-bar>
			</u-progress>
		</div>
		<div>
			<u-badge color="gray" tint="100" class="me-1" pill>
				<i class="icon-regular icon-temperature-half icon-fw me-1 fg-gray-300"></i>
				<%=state.cpuStats?.temperature?.main?.toFixed(0)%> °C
			</u-badge>
			<%if (state.cpuStats?.fan) {%>
				<u-badge color="gray" tint="100" class="me-1" pill>
					<i class="icon-solid icon-fan icon-fw me-1 fg-gray-300"></i>
					<%=state.cpuStats?.fan%> rpm
				</u-badge>
			<%}%>
		</div>
	<%}%>
</li>
