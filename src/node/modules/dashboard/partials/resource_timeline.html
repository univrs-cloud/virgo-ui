<%if (isAdmin) {%>
	<li class="list-group-item timeline">
		<%if (state.stats !== null) {%>
			<div class="resource-timeline numeric-tabular d-flex align-items-center gap-3 lh-1 fs-xs fg-gray-500">
				<span>1h</span>
				<div class="resource-timeline-track position-relative rounded bg-2 cursor-pointer">
					<div class="resource-timeline-window position-absolute top-0 bottom-0 rounded bg-blue-100 cursor-move">
						<span class="resource-timeline-handle position-absolute top-50 start-0 translate-middle rounded-pill bg-blue-500"></span>
						<span class="resource-timeline-handle position-absolute top-50 start-100 translate-middle rounded-pill bg-blue-500"></span>
					</div>
				</div>
				<span>now</span>
				<span class="resource-timeline-label text-nowrap ms-3"></span>
			</div>
		<%}%>
	</li>
<%}%>
