<li class="list-group-item timeline py-3">
	<%if (state.stats !== null) {%>
		<div class="resource-timeline">
			<small class="resource-timeline-label d-block lh-1 fs-xs fg-4 mb-2"></small>
			<div class="resource-timeline-track position-relative d-flex align-items-center justify-content-evenly rounded bg-gray-050 cursor-pointer">
				<%_.times(5, () => {%>
					<span class="resource-timeline-tick bg-gray-300"></span>
				<%});%>
				<div class="resource-timeline-window position-absolute top-0 bottom-0 border border-blue-300 rounded bg-blue-100 cursor-move">
					<span class="resource-timeline-handle position-absolute top-50 start-0 translate-middle rounded-pill bg-blue-500"></span>
					<span class="resource-timeline-handle position-absolute top-50 start-100 translate-middle rounded-pill bg-blue-500"></span>
				</div>
			</div>
		</div>
		<div class="d-flex align-items-center justify-content-between lh-1 fs-xs fg-4 mt-1">
			<small>1 hour ago</small>
			<small>Now</small>
		</div>
	<%}%>
</li>
