<div id="apps" class="d-none">
	<div class="row">
		<div class="col-12 page-title">
			<h4 class="m-0 ps-1">
				<i class="icon-duotone icon-dots-nine icon-width-auto me-3"></i>
				Apps
			</h4>
			<div class="position-absolute top-0 end-0 pe-5 mt--1">
				<a href="#app-center" class="btn-sm btn-outline theme-secondary py-1 min-h-0" data-bs-toggle="dialog">App center</a>
			</div>
		</div>
		<div class="loading d-flex justify-content-center align-items-center h-100"><div class="spinner-border fg-gray-600"></div></div>
		<div class="oops d-flex justify-content-center align-items-center h-100 d-none"><span class="fg-red-300">Error fetching data</span></div>
		<div class="empty-list no-content d-flex flex-column justify-content-center align-items-center d-none">
			<div class="no-content-image"><%=appsImage%></div>
			<h5 class="fg-4 mt-7">No apps installed</h5>
		</div>
		<div class="container-fluid position-relative d-none">
			<div class="card">
				<div class="card-body">
					<div class="row g-3 align-items-center">
						<div class="col col-6 md:col-4">
							<u-input type="search" name="search" placeholder="Search" class="search" no-floating></u-input>
						</div>
						<div class="col-auto">
							<div class="dropdown mb-7">
								<button type="button" class="btn-sm btn-icon btn-outline theme-secondary position-relative" data-bs-toggle="menu" data-bs-auto-close="outside">
									<i class="icon-fill icon-funnel icon-width-auto"></i>
									<span class="filter-count badge rounded-pill theme-primary position-absolute top-0 start-100 translate-middle"></span>
								</button>
								<div class="menu filter-menu" style="width: 320px;"></div>
							</div>
						</div>
						<div class="col-auto ms-auto mb-7">
							<span class="list-count small fg-emphasis-secondary text-nowrap"></span>
						</div>
					</div>
					<div class="table-scroll overflow-y-scroll mt--5 pe-5 mx-0 me--5">
						<table class="table table-hover align-middle numeric-tabular m-0">
							<thead class="sticky-top">
								<tr>
									<th class="orderable asc text-nowrap d-table-cell md:d-none" data-field="title">
										App
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable asc text-nowrap d-none md:d-table-cell" data-field="title" colspan="2">
										App
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="resourceMetrics.cpu.percent" data-default-order="desc" style="width: 100px; min-width: 100px;">
										<i class="icon-fill icon-cpu icon-fw" data-bs-toggle="tooltip" data-bs-original-title="CPU"></i>
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="resourceMetrics.memory.percent" data-default-order="desc" style="width: 100px; min-width: 100px;">
										<i class="icon-fill icon-memory icon-fw" data-bs-toggle="tooltip" data-bs-original-title="RAM"></i>
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="resourceMetrics.network.rx" data-default-order="desc" style="width: 120px; min-width: 120px;">
										<i class="icon-fill icon-network icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Network"></i>
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="resourceMetrics.storage.dataset" data-default-order="desc" style="width: 100px; min-width: 100px;">
										<i class="icon-fill icon-database icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Data"></i>
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-end text-nowrap d-none md:d-table-cell" data-field="resourceMetrics.storage.snapshots" data-default-order="desc" style="width: 100px; min-width: 100px;">
										<i class="icon-fill icon-clock-counter-clockwise icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Snapshots"></i>
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="text-center d-none md:d-table-cell" style="width: 70px; min-width: 70px;">State</th>
									<th style="width: 30px; min-width: 30px;"></th>
									<th style="width: 30px; min-width: 30px;"></th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
					<div class="no-results d-flex flex-column justify-content-center align-items-center flex-grow-1 py-7 d-none">
						<div class="no-content-image"><%=noResultsImage%></div>
						<h5 class="fg-4 mt-7 mb-0">Nothing matches the search or filters</h5>
					</div>
				</div>
			</div>
			<div class="details"></div>
		</div>
	</div>
</div>
