<%if (_.some(appJobs, { name: 'app:rollback' })) {%>
	<span class="btn-icon btn-text theme-secondary btn-sm pe-none"><i class="icon-solid icon-spinner-third icon-fw icon-spin"></i></span>
<%} else {%>
	<button type="button" class="snapshot-action btn-icon btn-text btn-sm <%=(point.canRollback ? 'theme-danger' : 'theme-secondary')%>" data-bs-toggle="tooltip" data-bs-original-title="Roll back" data-rollback-snapshot="<%-point.snapshot%>" data-rollback-date="<%-point.createdMoment.format('D MMM YYYY, HH:mm')%>" <%=(point.canRollback ? '' : 'disabled')%>><i class="icon-regular icon-clock-rotate-left icon-fw"></i></button>
<%}%>
