<dialog id="mail-account-create" class="dialog dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">New account</h1>
		</div>
		<div class="dialog-body">
			<u-select name="domain" label="Domain" class="domain"></u-select>
			<u-input name="localPart" label="Name" class="local-part" autocomplete="off">
				<span slot="suffix" class="domain-suffix"></span>
			</u-input>
			<u-input type="password" name="password" label="Password" class="password" autocomplete="off"></u-input>
			<u-input type="password" name="passwordCheck" label="Confirm password" class="password-check" autocomplete="off"></u-input>
			<u-input name="quota" label="Storage limit" class="quota">
				<span slot="suffix">GiB</span>
			</u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Create</u-button>
		</div>
	</u-form>
</dialog>
