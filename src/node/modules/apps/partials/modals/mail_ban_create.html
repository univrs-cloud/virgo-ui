<dialog id="mail-ban-create" class="dialog dialog-scrollable">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">Block IP</h1>
		</div>
		<div class="dialog-body">
			<u-input name="ip" label="IP address" class="ip" autocomplete="off"></u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Block</u-button>
		</div>
	</u-form>
</dialog>
