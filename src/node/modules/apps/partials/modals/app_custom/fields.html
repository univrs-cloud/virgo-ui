<div class="dialog-body">
	<div class="row g-7">
		<div class="col-12 lg:col-6">
			<div class="row g-5">
				<div class="col">
					<u-input label="Name" class="app-name" tip="Also names the app's own storage space, where its volumes are kept and snapshotted."></u-input>
				</div>
				<div class="col-auto">
					<div class="shortcut-icon-field mb-7">
						<u-input type="hidden" class="shortcut-icon"></u-input>
						<div class="shortcut-icon-box d-flex align-items-center justify-content-center" tabindex="0" data-bs-toggle="popover">
							<img class="shortcut-icon-img" src="assets/img/univrs.svg" alt="" width="32" height="32">
						</div>
						<div class="shortcut-icon-popover-content d-none">
							<u-input type="search" placeholder="Search" class="shortcut-icon-search" autocomplete="off" no-floating></u-input>
							<div class="shortcut-icon-results"></div>
						</div>
					</div>
				</div>
			</div>
			<div class="services"></div>
			<button type="button" class="add-service btn-link d-inline-block p-0 min-h-0"><i class="icon-plus icon-fw me-1"></i>Add service</button>
			<div class="protection card bg-1 mt-5">
				<div class="protection-body card-body"></div>
			</div>
		</div>
		<div class="col-12 lg:col-6">
			<div class="app-custom-compose position-sticky top-0 d-flex flex-column">
				<div class="fg-emphasis-secondary mb-3">docker-compose.yml</div>
				<div class="d-flex flex-fill min-h-0 bg-2 rounded-3 p-4">
					<pre class="compose flex-fill min-w-0 overflow-auto fs-sm mb-0"></pre>
				</div>
			</div>
		</div>
	</div>
</div>
