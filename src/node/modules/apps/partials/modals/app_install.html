<dialog id="app-install" class="dialog dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">App install</h1>
		</div>
		<div class="dialog-body">
			<div class="mb-7">
				<p class="description mb-3"></p>
				<p class="note alert theme-info p-3 mb-0 d-none"></p>
			</div>
			<div class="password-note d-flex align-items-start fg-emphasis-secondary mb-8 d-none">
				<i class="icon-info icon-fw fg-blue-500 me-3 mt-1"></i>
				<small>Leave password fields empty to keep their current values.</small>
			</div>
			<div class="inputs"></div>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Install</u-button>
		</div>
	</u-form>
</dialog>
