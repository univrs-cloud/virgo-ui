<dialog id="nextcloud-account-update" class="dialog dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">Edit account</h1>
		</div>
		<div class="dialog-body">
			<div class="alert theme-secondary mb-5">
				<dl class="m-0">
					<dt class="fw-light fg-4"><small>Username</small></dt>
					<dd class="title-user m-0"></dd>
				</dl>
			</div>
			<u-input name="displayName" label="Name" class="display-name" autocomplete="off"></u-input>
			<u-input type="email" name="email" label="Email address" class="email" autocomplete="off"></u-input>
			<u-input name="quota" label="Storage limit" class="quota">
				<span slot="suffix">GiB</span>
			</u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Update</u-button>
		</div>
	</u-form>
</dialog>
