<dialog id="nextcloud-account-create" class="dialog dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">New account</h1>
		</div>
		<div class="dialog-body">
			<u-input name="user" label="Username" class="user" autocomplete="off"></u-input>
			<u-input name="displayName" label="Name" class="display-name" autocomplete="off"></u-input>
			<u-input type="email" name="email" label="Email address" class="email" autocomplete="off"></u-input>
			<u-input type="password" name="password" label="Password" class="password" autocomplete="off"></u-input>
			<u-input type="password" name="passwordCheck" label="Confirm password" class="password-check" autocomplete="off"></u-input>
			<u-select label="Groups" class="groups" multiple></u-select>
			<u-input name="quota" label="Storage limit" class="quota">
				<span slot="suffix">GiB</span>
			</u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Add</u-button>
		</div>
	</u-form>
</dialog>
