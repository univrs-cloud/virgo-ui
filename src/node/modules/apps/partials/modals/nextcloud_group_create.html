<dialog id="nextcloud-group-create" class="dialog dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">New group</h1>
		</div>
		<div class="dialog-body">
			<u-input name="group" label="Name" class="group" autocomplete="off"></u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Add</u-button>
		</div>
	</u-form>
</dialog>
