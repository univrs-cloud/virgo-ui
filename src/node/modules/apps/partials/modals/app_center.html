<dialog id="app-center" class="dialog dialog-xl dialog-scrollable">
	<div class="dialog-header">
		<h1 class="dialog-title"></h1>
		<ul class="nav nav-pills d-flex mt--1 mb--1">
			<li class="nav-item">
				<a href="#app-center-explore" class="nav-link active d-flex align-items-center" data-bs-toggle="tab">Explore
					<span class="count-explore badge rounded-pill bd-red-100">0</span>
				</a>
			</li>
			<li class="nav-item">
				<a href="#app-center-installed" class="nav-link d-flex align-items-center" data-bs-toggle="tab">Installed
					<span class="count-installed badge rounded-pill bd-red-100">0</span>
				</a>
			</li>
		</ul>
		<button type="button" class="btn-close" data-bs-dismiss="dialog"></button>
	</div>
	<div class="dialog-body">
		<div class="loading d-flex justify-content-center align-items-center h-100"><div class="spinner-border fg-gray-600"></div></div>
		<div class="oops d-flex justify-content-center align-items-center h-100 d-none"><span class="fg-red-300">Error fetching data</span></div>
		<div class="tab-content d-none">
			<div id="app-center-explore" class="tab-pane fade show active" tabindex="0">
				<div class="row"></div>
			</div>
			<div id="app-center-installed" class="tab-pane fade" tabindex="1">
				<div class="row"></div>
			</div>
		</div>
	</div>
</dialog>
