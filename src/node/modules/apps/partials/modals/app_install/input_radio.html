<div class="mb-5">
	<div class="fg-emphasis-secondary"><%-env.label%></div>
	<%_.each(env.select, (option) => {%>
		<label class="d-flex align-items-center gap-3">
			<input type="radio" name="<%-env.name%>" value="<%-option.value%>" class="radio" <%=(option.default ? 'checked' : '')%>>
			<%-option.text%>
		</label>
	<%})%>
</div>
