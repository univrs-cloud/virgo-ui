<dialog id="app-custom-create" class="dialog dialog-xl dialog-scrollable h-100" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">New custom app</h1>
		</div>
		<%=fields%>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Create</u-button>
		</div>
	</u-form>
</dialog>
