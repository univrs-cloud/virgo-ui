<dialog id="snapshot-rule-update" class="dialog dialog-lg dialog-scrollable" tabindex="-1">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">Edit rule</h1>
		</div>
		<div class="dialog-body"></div>
		<div class="dialog-footer">
			<small class="rule-preview fg-emphasis-secondary"></small>
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Update</u-button>
		</div>
	</u-form>
</dialog>
