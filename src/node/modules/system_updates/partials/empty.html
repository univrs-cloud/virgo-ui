<div class="no-content-image"><%=upToDateImage%></div>
<h5 class="fg-4 mt-7">Up to date</h5>
<p class="fg-4 text-center mb-0">The node checks for updates every day at midnight.</p>
<a href="#" class="check-updates btn-link d-inline-block text-nowrap border-0 text-decoration-none px-0 py-3 mt-3 min-h-0 <%=(checkUpdates ? 'disabled' : '')%>">
	<i class="icon-regular icon-arrows-clockwise icon-fw <%=(checkUpdates ? 'icon-spin' : '')%>"></i>
	<span class="ms-1"><%=(checkUpdates ? 'Checking for updates...' : 'Check for new updates')%></span>
</a>
