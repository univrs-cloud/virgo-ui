<dialog id="profile-edit" class="dialog dialog-scrollable">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">Edit profile</h1>
		</div>
		<div class="dialog-body">
			<div class="alert theme-secondary mb-5">
				<dl class="m-0">
					<dt class="fw-light fg-4"><small>Username</small></dt>
					<dd class="title-username m-0"></dd>
				</dl>
			</div>
			<u-input name="fullname" label="Name" class="fullname"></u-input>
			<u-input type="email" name="email" label="Email address" class="email"></u-input>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Update</u-button>
		</div>
	</u-form>
</dialog>
