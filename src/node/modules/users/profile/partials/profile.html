<div class="col col-12">
	<div class="row gx-7 gy-3">
		<div class="col-12 lg:col-4 2xl:col-3">
			<h5 class="m-0">Account</h5>
			<p class="fg-emphasis-secondary small mt-1 mb-0">Your name and email address on this node.</p>
		</div>
		<div class="col-12 lg:col-8 2xl:col-9">
			<div class="card border-0 mb-0">
				<div class="card-body">
					<div class="d-flex align-items-center gap-5">
						<div class="d-flex align-items-center justify-content-center flex-shrink-0 size-5 rounded-circle bg-subtle-primary fg-primary fs-lg text-uppercase align-self-start"><%-_.head(user.fullname || user.username)%></div>
						<div class="min-w-0 me-auto">
							<div class="fs-lg lh-1 text-break"><%-user.fullname || user.username%></div>
							<div class="d-flex flex-wrap gap-3" style="margin-top: 0.3125rem;">
								<u-badge color="gray" tint="100" pill><small><span class="fw-lighter me-1">Username</span><%-user.username%></small></u-badge>
								<u-badge color="gray" tint="100" pill><small><span class="fw-lighter me-1">Email address</span><%-user.email || '—'%></small></u-badge>
							</div>
						</div>
						<a href="#profile-edit" class="btn-link d-inline-block text-nowrap align-self-start border-0 px-0 py-3 mt-1 min-h-0" data-bs-toggle="dialog"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="col col-12">
	<div class="row gx-7 gy-3">
		<div class="col-12 lg:col-4 2xl:col-3">
			<h5 class="m-0">Password</h5>
			<p class="fg-emphasis-secondary small mt-1 mb-0">The password you log in with.</p>
		</div>
		<div class="col-12 lg:col-8 2xl:col-9">
			<div class="card border-0 mb-0">
				<div class="card-body">
					<div class="d-flex align-items-center gap-5">
						<div class="d-flex align-items-center justify-content-center flex-shrink-0 size-5 rounded-5 bg-subtle-primary fg-primary align-self-start"><i class="icon-duotone icon-solid icon-key"></i></div>
						<div class="min-w-0 me-auto">Password</div>
						<a href="#profile-password" class="btn-link d-inline-block text-nowrap align-self-start border-0 px-0 py-3 mt-1 min-h-0" data-bs-toggle="dialog"><i class="icon-regular icon-pen icon-fw me-1"></i>Change</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
