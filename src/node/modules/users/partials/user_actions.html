<div class="dropdown">
	<span data-bs-toggle="menu" data-bs-placement="bottom-end" class="btn-icon btn-text theme-secondary btn-sm"><i class="icon-fill icon-dots-three-outline-vertical icon-fw fg-secondary"></i></span>
	<div class="menu">
		<a href="#user-update" class="menu-item" data-bs-toggle="dialog"><i class="icon-fill icon-pen icon-fw"></i>Edit</a>
		<%if (!user.isOwner && user.username !== account.user) {%>
			<%if (!user.isDisabled) {%>
				<a href="#user-password" class="menu-item" data-bs-toggle="dialog"><i class="icon-fill icon-key icon-fw"></i>Change password</a>
			<%}%>
			<div class="menu-divider"></div>
			<%if (user.isDisabled) {%>
				<a href="#" class="menu-item" data-action="unlock"><i class="icon-fill icon-lock-open icon-fw"></i>Unlock</a>
			<%} else {%>
				<a href="#" class="menu-item fg-danger confirm" data-action="lock"><i class="icon-fill icon-lock icon-fw"></i>Lock</a>
			<%}%>
			<div class="menu-divider"></div>
			<a href="#" class="menu-item fg-danger confirm" data-action="delete"><i class="icon-fill icon-x-circle icon-fw"></i>Delete</a>
		<%}%>
	</div>
</div>
