<dialog id="user-update" class="dialog dialog-scrollable">
	<u-form>
		<div class="dialog-header">
			<h1 class="dialog-title">Edit user</h1>
		</div>
		<div class="dialog-body">
			<u-input name="fullname" label="Name" class="fullname"></u-input>
			<u-input type="email" name="email" label="Email address" class="email"></u-input>

			<u-checkbox name="role" on-value="admin" off-value="" class="role d-none" label="Has administrator role?"></u-checkbox>
		</div>
		<div class="dialog-footer">
			<u-button variant="secondary" class="d-flex ms-auto" data-bs-dismiss="dialog" outline>Cancel</u-button>
			<u-button type="submit" variant="primary">Update</u-button>
		</div>
	</u-form>
</dialog>
