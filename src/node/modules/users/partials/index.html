<div id="users" class="d-none">
	<div class="row">
		<div class="col-12 page-title">
			<h4 class="m-0 ps-1">
				<i class="icon-duotone icon-user icon-width-auto me-3"></i>
				Users
			</h4>
			<div class="position-absolute top-0 end-0 pe-5 mt--1">
				<a href="#user-create" class="btn-sm btn-outline theme-secondary py-1 min-h-0" data-bs-toggle="dialog">New user</a>
			</div>
		</div>
		<div class="loading d-flex justify-content-center align-items-center h-100"><div class="spinner-border fg-gray-600"></div></div>
		<div class="oops d-flex justify-content-center align-items-center h-100 d-none"><span class="fg-red-300">Error fetching data</span></div>
		<div class="container-fluid position-relative d-none">
			<div class="card">
				<div class="card-body">
					<div class="row g-3 align-items-center">
						<div class="col col-6 md:col-4">
							<u-input type="search" name="search" placeholder="Search" class="search" no-floating></u-input>
						</div>
						<div class="col-auto ms-auto mb-7">
							<span class="list-count small fg-emphasis-secondary text-nowrap"></span>
						</div>
					</div>
					<div class="table-scroll overflow-y-scroll mt--5 pe-5 mx-0 me--5">
						<table class="table table-hover align-middle m-0">
							<thead class="sticky-top">
								<tr>
									<th class="orderable asc text-nowrap" data-field="username">
										User
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="orderable text-nowrap d-none md:d-table-cell" data-field="fullname">
										Name
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th class="text-nowrap d-none md:d-table-cell">Groups</th>
									<th class="text-center text-nowrap d-none md:d-table-cell" style="width: 40px; min-width: 40px;">
										<i class="icon-fill icon-terminal-window icon-fw" data-bs-toggle="tooltip" data-bs-original-title="Shell access"></i>
									</th>
									<th class="text-nowrap" style="width: 85px; min-width: 85px;">Sessions</th>
									<th class="orderable text-nowrap d-none md:d-table-cell" data-field="isDisabled" style="width: 85px; min-width: 85px;">
										State
										<i class="icon icon-fill icon-caret-up-down icon-fw"></i>
									</th>
									<th style="width: 30px; min-width: 30px;"></th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
			<div class="details"></div>
		</div>
	</div>
</div>
