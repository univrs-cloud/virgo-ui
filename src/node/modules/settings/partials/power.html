<div class="col col-12">
	<div class="row gx-7 gy-3">
		<div class="col-12 lg:col-4 2xl:col-3">
			<h5 class="m-0">Power</h5>
			<p class="fg-emphasis-secondary small mt-1 mb-0">Restart or shut down the node.</p>
		</div>
		<div class="col-12 lg:col-8 2xl:col-9">
			<div class="card border-0 mb-0">
				<div class="card-body">
					<div class="d-flex align-items-center gap-5">
						<div class="min-w-0 me-auto">
							<div>Reboot</div>
							<small class="d-block fg-4">The node and its apps are unavailable until it is back.</small>
						</div>
						<u-button variant="danger" size="sm" class="flex-shrink-0" data-action="reboot">Reboot</u-button>
					</div>

					<hr class="border-gray-200 my-5 opacity-25">

					<div class="d-flex align-items-center gap-5">
						<div class="min-w-0 me-auto">
							<div>Shut down</div>
							<small class="d-block fg-4">The node stays off until you power it on again.</small>
						</div>
						<u-button variant="danger" size="sm" class="flex-shrink-0" data-action="shut-down">Shut down</u-button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
