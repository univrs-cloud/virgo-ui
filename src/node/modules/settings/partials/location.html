<div class="col col-12">
	<div class="row gx-4 gy-2">
		<div class="col-12 col-lg-4 col-xxl-3">
			<h6 class="m-0">Location</h6>
			<p class="text-body-secondary small mt-1 mb-0">Where the weather on the Dashboard is for.</p>
		</div>
		<div class="col-12 col-lg-8 col-xxl-9">
			<div class="card rounded-4 border-0 mb-0">
				<div class="card-body">
					<%if (_.isNull(location)) {%>
						<div class="d-flex align-items-center gap-3">
							<div class="d-flex align-items-center justify-content-center flex-shrink-0 size-5 rounded-3 bg-gray-200 text-gray-600 align-self-start"><i class="icon-duotone icon-solid icon-location-dot"></i></div>
							<div class="me-auto">Not configured</div>
							<a href="#location" class="btn btn-link text-nowrap align-self-start border-0 px-0 py-2 mt-1" data-bs-toggle="modal"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit</a>
						</div>
					<%} else {%>
						<div class="d-flex align-items-center gap-3">
							<div class="d-flex align-items-center justify-content-center flex-shrink-0 size-5 rounded-3 bg-blue-100 text-blue-500 align-self-start"><i class="icon-duotone icon-solid icon-location-dot"></i></div>
							<dl class="d-flex flex-column flex-md-row column-gap-4 row-gap-3 min-w-0 me-auto mt-1 mt-md-0 mb-0">
								<div class="min-w-0">
									<dt class="fw-lighter lh-1"><small>Latitude</small></dt>
									<dd class="m-0 text-break"><%-location?.latitude%></dd>
								</div>
								<div class="min-w-0">
									<dt class="fw-lighter lh-1"><small>Longitude</small></dt>
									<dd class="m-0 text-break"><%-location?.longitude%></dd>
								</div>
							</dl>
							<a href="#location" class="btn btn-link text-nowrap align-self-start border-0 px-0 py-2 mt-1" data-bs-toggle="modal"><i class="icon-regular icon-pen icon-fw me-1"></i>Edit</a>
						</div>
					<%}%>
				</div>
			</div>
		</div>
	</div>
</div>
