<div id="topology" class="numeric-tabular d-none">
	<div class="row">
		<div class="col-12 position-relative mb-5">
			<h4 class="m-0">
				<i class="icon-duotone icon-solid icon-chart-diagram icon-width-auto me-3"></i>
				Topology
			</h4>
		</div>
		<div class="loading d-flex justify-content-center align-items-center h-100"><div class="spinner-border fg-gray-600"></div></div>
		<div class="oops d-flex justify-content-center align-items-center h-100 d-none"><span class="fg-red-300">Error fetching data</span></div>
		<div class="container-fluid d-none">
			<div class="card border-0 mb-0">
				<div class="card-body p-0">
					<div class="topology-viewport">
						<div class="topology-tree">
							<svg class="topology-edges"></svg>
							<canvas class="topology-particles topology-flows"></canvas>
							<div class="topology-content"></div>
						</div>
						<div class="topology-controls position-absolute top-0 start-0 m-3">
							<u-switch class="traffic-switch" on-label="Traffic"></u-switch>
						</div>
						<div class="topology-controls btn-toolbar position-absolute top-0 end-0 m-3">
							<button type="button" class="btn-icon btn-subtle btn-sm theme-secondary border" data-action="fit"><i class="icon-regular icon-expand icon-fw"></i></button>
							<div class="btn-group btn-group-sm">
								<button type="button" class="btn-icon btn-subtle theme-secondary border" data-action="zoom-out"><i class="icon-regular icon-minus icon-fw"></i></button>
								<button type="button" class="btn-icon btn-subtle theme-secondary border" data-action="zoom-in"><i class="icon-regular icon-plus icon-fw"></i></button>
							</div>
						</div>
					</div>
					<div class="d-flex flex-wrap align-items-center column-gap-5 row-gap-1 flex-shrink-0 border-top px-3 py-2">
						<small class="d-flex align-items-center fg-4"><span class="topology-legend topology-edge-primary me-2"></span>By domain</small>
						<small class="d-flex align-items-center fg-4"><span class="topology-legend topology-edge-primary topology-edge-dashed me-2"></span>By port</small>
						<small class="d-flex align-items-center fg-4"><span class="topology-legend topology-edge-dotted me-2"></span>Internal only</small>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
