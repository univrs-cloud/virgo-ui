<%_.each(windows, (item) => {%>
	<div class="d-flex align-items-center">
		<a href="#" class="nav-window nav-item nav-link d-flex align-items-center flex-grow-1 min-w-0 fg-white <%=(item.maximized ? (item.minimized ? 'fg-80' : 'active') : (item.minimized ? 'fg-50 fst-italic' : (item.active ? '' : 'fg-80')))%>" data-window-id="<%-item.id%>">
			<span class="window-icon d-flex justify-content-center align-items-center flex-shrink-0 rounded-3 bg-white fg-body <%=(item.minimized ? 'opacity-50' : '')%>">
				<%if (!item.icon) {%>
					<i class="icon-light icon-layer-group icon-sm"></i>
				<%} else {%>
					<img src="<%-(_.includes(item.icon, '/') ? item.icon : `assets/img/${item.type}s/${item.icon}`)%>">
				<%}%>
			</span>
			<span class="nav-label flex-grow-1 text-truncate ms-3">&nbsp;<%-item.label%></span>
			<%if (item.maximized) {%>
				<i class="unmaximize-window icon-regular icon-clone icon-xs icon-fw p-1 me-3"></i>
			<%}%>
			<i class="close-window icon-solid icon-times icon-xs icon-fw p-1"></i>
			<i class="close-window rail-only icon-solid icon-circle-xmark icon-sm"></i>
		</a>
	</div>
<%});%>
