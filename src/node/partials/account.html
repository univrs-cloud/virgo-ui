<%if (!isAuthenticated) {%>
	<a href="/login?rd=<%=encodeURIComponent(window.location)%>" rel="external" class="btn-sm btn-solid theme-primary me-3 sm:me-0">
		<i class="icon-duotone icon-solid icon-person-to-portal icon-fw"></i>
		<span class="nav-label ms-3">Sign in</span>
	</a>
<%} else {%>
	<div class="dropdown d-flex align-items-center">
		<button type="button" class="account-toggle d-flex align-items-center gap-3 w-100 border-0 bg-transparent rounded-4 p-3 fg-white" data-bs-toggle="menu" data-bs-placement="top-end">
			<span class="avatar avatar-sm avatar-subtle theme-primary flex-shrink-0"><%-_.join(_.map(_.take(_.words(account.name || account.email), 2), _.head), '')%></span>
			<span class="d-none sm:d-block text-start min-w-0 flex-grow-1" style="line-height: 1.2;">
				<span class="d-block text-truncate fw-medium" style="font-size: 0.875rem;" title="<%-account.name || account.email || '—'%>"><%-account.name || account.email || '—'%></span>
				<%if (account.name && account.email) {%>
					<span class="d-block text-truncate fw-light opacity-75" style="font-size: 0.8125rem;"><%-account.email%></span>
				<%}%>
			</span>
			<i class="icon-light icon-angles-up-down icon-fw d-none sm:d-inline-block flex-shrink-0 opacity-75" style="font-size: 0.8125rem;"></i>
		</button>
		<div class="menu" style="max-width: min(18rem, calc(100vw - 1.5rem));">
			<h6 class="menu-header">Logged in as</h6>
			<p class="text-truncate fw-medium px-3 pb-3 mt--1 mb-0" title="<%-account.name || account.email || '—'%>"><%-account.name || account.email || '—'%></p>
			<%if (!isUpdating || runtimeRole === 'fleet') {%>
				<div class="menu-divider"></div>
				<a href="/users/profile" class="menu-item" <%=(runtimeRole === 'fleet' ? 'rel="external"' : '')%>>
				<i class="icon-duotone icon-solid icon-id-card icon-fw"></i>
				Your profile
			</a>
			<%}%>
			<div class="menu-divider"></div>
			<a href="https://docs.univrs.cloud" target="_blank" rel="noopener noreferrer" class="menu-item">
				<i class="icon-duotone icon-solid icon-book-open icon-fw"></i>
				Documentation
				<i class="icon-solid icon-sm icon-arrow-up-right-from-square ms-3"></i>
			</a>
			<div class="menu-divider"></div>
			<a href="#" rel=“nofollow“ class="sign-out menu-item">
				Sign out
				<i class="icon-duotone icon-solid icon-person-from-portal icon-fw"></i>
			</a>
		</div>
	</div>
<%}%>
